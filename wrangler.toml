name = "james-crosses-life"
compatibility_date = "2026-02-24"
pages_build_output_dir = "."

# Local/dev binding placeholders. Replace database_id after creating D1 DB.
[[d1_databases]]
binding = "LEADERBOARD_DB"
database_name = "jcl-leaderboard-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"

[vars]
APP_ENV = "development"

[env.production.vars]
APP_ENV = "production"

[[env.production.d1_databases]]
binding = "LEADERBOARD_DB"
database_name = "jcl-leaderboard-prod"
database_id = "REPLACE_WITH_PROD_D1_DATABASE_ID"
